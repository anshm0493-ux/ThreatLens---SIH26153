<html><head><title>ThreatLens</title><style>body{background:#0f172a;color:white;font-family:Arial;padding:30px} .card{background:#1e293b;padding:15px;border-radius:10px;display:inline-block;margin:10px;width:150px;text-align:center} table{width:100%;border-collapse:collapse;margin-top:20px;background:#1e293b;border-radius:10px;overflow:hidden} th{background:#334155;padding:12px} td{padding:12px;border-bottom:1px solid #334155} .HIGH{color:orange;font-weight:bold} .CRITICAL{color:#ff4444;font-weight:bold} .MEDIUM{color:yellow}</style></head><body><h1>🛡️ ThreatLens - SIH26153</h1><p>Live Threat Forecasting System | Time: {{time}}</p><div class="card"><h2>1245</h2><p>Logs Analyzed</p></div><div class="card"><h2>3</h2><p>Attacks Predicted</p></div><div class="card"><h2>91%</h2><p>Accuracy</p></div><table><tr><th>IP</th><th>Attack Type</th><th>Risk</th><th>Recommended Action</th></tr>{% for a in attacks %}<tr><td>{{a.ip}}</td><td>{{a.type}}</td><td class="{{a.risk}}">{{a.risk}}</td><td>{{a.action}}</td></tr>{% endfor %}</table></body></html>
